name: Bug report
description: Something in an image does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "For a security problem, do not use this form: see SECURITY.md."
  - type: input
    id: image
    attributes:
      label: Image and tag
      placeholder: ghcr.io/dooservice/dooservice-operator:18.0-20261013
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. docker run …\n2. …"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
