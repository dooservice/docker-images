name: Build

# The images servers run, built on GitHub's machines and not on a server of ours: each Odoo
# version on a runner of its own, its console right after it, and Postgres and the status
# page beside them.
# Building only publishes; servers take the new images when a platform pins them
# (`make platform` in the agent repository). The Odoo versions are the ones `[odoo]` of the
# agent's platform.toml offers, read with the GH_PAT secret.
#
#   gh workflow run build.yml --repo dooservice/docker-images
#   gh workflow run build.yml --repo dooservice/docker-images -f versions=18.0
on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Odoo versions, comma-separated; empty is all of them"
        required: false
        default: ""
      postgres:
        description: "Build the Postgres images too"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  versions:
    name: Which versions, and the revision
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      offered: ${{ steps.pick.outputs.offered }}
      revision: ${{ steps.revision.outputs.revision }}
    steps:
      - uses: actions/checkout@v7

      - name: The agent's platform.toml
        run: |
          gh api repos/dooservice/agent/contents/platform.toml -H "Accept: application/vnd.github.raw" > platform.toml
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - uses: actions/upload-artifact@v7
        with:
          name: platform
          path: platform.toml

      - id: pick
        run: |
          offered="$(python3 versions.py platform.toml | paste -sd, -)"
          wanted="${WANTED:-${offered}}"
          for version in ${wanted//,/ }; do
            case ",${offered}," in
              *",${version},"*) ;;
              *) echo "::error::Odoo ${version} is not in [odoo] of platform.toml"; exit 1 ;;
            esac
          done
          echo "matrix=$(jq -cn --arg wanted "${wanted}" '$wanted | split(",") | map(gsub(" "; ""))')" >> "$GITHUB_OUTPUT"
          echo "offered=$(jq -cn --arg offered "${offered}" '$offered | split(",")')" >> "$GITHUB_OUTPUT"
        env:
          WANTED: ${{ inputs.versions }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      # One revision for every image of this build: today's date, the way Odoo's own images
      # are tagged. A second build the same day takes -2, then -3: a revision never moves,
      # because what a platform pinned has to stay where it was.
      - id: revision
        run: |
          first="$(jq -r '.[0]' <<< "${MATRIX}")"
          day="$(date -u +%Y%m%d)"
          revision="${day}"
          number=1
          while docker buildx imagetools inspect "ghcr.io/dooservice/dooservice-odoo:${first}-${revision}" >/dev/null 2>&1 \
             || docker buildx imagetools inspect "ghcr.io/dooservice/dooservice-postgres:16-${revision}" >/dev/null 2>&1; do
            number=$((number + 1))
            revision="${day}-${number}"
          done
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"
          echo "Revision ${revision}" >> "$GITHUB_STEP_SUMMARY"
        env:
          MATRIX: ${{ steps.pick.outputs.matrix }}

  # What a console needs to find before it is built: the repository where the agent mounts
  # it (`ODOO_ADDONS_DIR` in dooservice-core), a set of skills for every version, and the
  # commit of the assistant every Odoo image carries.
  checks:
    name: Paths, skills and the assistant
    needs: versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: The repository is at /mnt/addons
        run: |
          if grep -rn "/mnt/extra-addons" operator/rootfs operator/Dockerfile; then
            echo "::error::the agent mounts the repository at /mnt/addons"
            exit 1
          fi

      - name: Every version has its skills, each named as its directory
        run: |
          for version in $(jq -r '.[]' <<< "${OFFERED}"); do
            test -d "operator/skills/odoo/${version}" || { echo "::error::no skills for ${version}"; exit 1; }
          done
          for skill in operator/skills/odoo/*/*/SKILL.md operator/skills/dooservice/*/SKILL.md; do
            name="$(basename "$(dirname "${skill}")")"
            grep -q "^name: ${name}$" "${skill}" || { echo "::error::${skill} is not named ${name}"; exit 1; }
          done
        env:
          OFFERED: ${{ needs.versions.outputs.offered }}

      - name: Every version has the assistant's commit
        run: python3 brain.py odoo/brain.toml --check $(jq -r '.[]' <<< "${OFFERED}")
        env:
          OFFERED: ${{ needs.versions.outputs.offered }}

  odoo:
    name: Odoo ${{ matrix.version }} and its console
    needs: [versions, checks]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # An Odoo image and its console come to some 8 GB; the runner starts with less free.
      - uses: actions/download-artifact@v8
        with:
          name: platform

      - name: Make room
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Odoo
        working-directory: odoo
        run: ./build.sh "${{ matrix.version }}"
        env:
          REVISION: ${{ needs.versions.outputs.revision }}
          PLATFORM_TOML: ../platform.toml

      - name: Console
        working-directory: operator
        run: ./build.sh "${{ matrix.version }}"
        env:
          REVISION: ${{ needs.versions.outputs.revision }}
          PLATFORM_TOML: ../platform.toml

  postgres:
    name: Postgres
    needs: versions
    if: inputs.postgres
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Postgres
        working-directory: postgres
        run: ./build.sh
        env:
          REVISION: ${{ needs.versions.outputs.revision }}

  status:
    name: Status page
    needs: versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Tests
        working-directory: status
        run: python3 -m unittest discover tests

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Status
        working-directory: status
        run: ./build.sh
        env:
          REVISION: ${{ needs.versions.outputs.revision }}
