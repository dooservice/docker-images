name: Build

# The images servers run, built on GitHub's machines and not on a server of ours: each Odoo
# version on a runner of its own, its console right after it, and Postgres beside them.
# Building only publishes; servers take the new images when a platform pins them
# (`make platform` in the agent repository).
#
#   gh workflow run build.yml --repo dooservice/docker-images
#   gh workflow run build.yml --repo dooservice/docker-images -f versions=18.0
on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Odoo versions, comma-separated; empty is all of them"
        required: false
        default: ""
      postgres:
        description: "Build the Postgres images too"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  versions:
    name: Which versions, and the revision
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      revision: ${{ steps.revision.outputs.revision }}
    steps:
      - id: pick
        run: |
          wanted="${WANTED:-16.0,17.0,18.0,19.0,20.0}"
          echo "matrix=$(jq -cn --arg wanted "${wanted}" '$wanted | split(",") | map(gsub(" "; ""))')" >> "$GITHUB_OUTPUT"
        env:
          WANTED: ${{ inputs.versions }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      # One revision for every image of this build: today's date, the way Odoo's own images
      # are tagged. A second build the same day takes -2, then -3: a revision never moves,
      # because what a platform pinned has to stay where it was.
      - id: revision
        run: |
          day="$(date -u +%Y%m%d)"
          revision="${day}"
          number=1
          while docker buildx imagetools inspect "ghcr.io/dooservice/dooservice-odoo:${FIRST}-${revision}" >/dev/null 2>&1 \
             || docker buildx imagetools inspect "ghcr.io/dooservice/dooservice-postgres:16-${revision}" >/dev/null 2>&1; do
            number=$((number + 1))
            revision="${day}-${number}"
          done
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"
          echo "Revision ${revision}" >> "$GITHUB_STEP_SUMMARY"
        env:
          FIRST: ${{ fromJson(steps.pick.outputs.matrix)[0] }}

  # What a console needs to find before it is built: the repository where the agent mounts
  # it (`ODOO_ADDONS_DIR` in dooservice-core), and a set of skills for every version.
  checks:
    name: Paths and skills
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: The repository is at /mnt/addons
        run: |
          if grep -rn "/mnt/extra-addons" operator/rootfs operator/Dockerfile; then
            echo "::error::the agent mounts the repository at /mnt/addons"
            exit 1
          fi

      - name: Every version has its skills, each named as its directory
        run: |
          for version in 16.0 17.0 18.0 19.0 20.0; do
            test -d "operator/skills/${version}" || { echo "::error::no skills for ${version}"; exit 1; }
          done
          for skill in operator/skills/*/*/SKILL.md; do
            name="$(basename "$(dirname "${skill}")")"
            grep -q "^name: ${name}$" "${skill}" || { echo "::error::${skill} is not named ${name}"; exit 1; }
          done

  odoo:
    name: Odoo ${{ matrix.version }} and its console
    needs: [versions, checks]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      # An Odoo image and its console come to some 8 GB; the runner starts with less free.
      - name: Make room
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Odoo
        working-directory: odoo
        run: ./build.sh "${{ matrix.version }}"
        env:
          REVISION: ${{ needs.versions.outputs.revision }}

      - name: Console
        working-directory: operator
        run: ./build.sh "${{ matrix.version }}"
        env:
          REVISION: ${{ needs.versions.outputs.revision }}

  postgres:
    name: Postgres
    needs: versions
    if: inputs.postgres
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Postgres
        working-directory: postgres
        run: ./build.sh
        env:
          REVISION: ${{ needs.versions.outputs.revision }}
