# One configuration for every Python file in the repository. The console's code runs on the
# Python of each Odoo image, 3.9 under Odoo 16.0, so that is the version to stay within; the
# status page runs on its own image's Python.
line-length = 120
target-version = "py39"
src = ["operator/rootfs/opt/dooservice/lib", "status"]
extend-include = [
  "operator/rootfs/usr/local/bin/claude",
  "operator/rootfs/usr/local/bin/dooservice",
  "operator/rootfs/usr/local/bin/odoo-bin",
  "operator/rootfs/usr/local/bin/opencode",
  "operator/rootfs/usr/local/bin/psql",
  "operator/rootfs/opt/dooservice/git-hooks/dispatch",
]
extend-exclude = [
  "odoo/cli-patches",
  "operator/skills",
]

[per-file-target-version]
"status/**" = "py313"
"versions.py" = "py312"

[lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "N", "C4", "RET", "PIE", "PL"]
ignore = [
  "N818",
  "PLR0912",
  "PLR0913",
  "PLR2004",
  "PLW2901",
  "SIM115",
  "UP006",
  "UP007",
  "UP035",
  "UP045",
]

[lint.isort]
known-first-party = ["dooservice_console", "dooservice_mcp", "dooservice_status"]
